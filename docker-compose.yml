# Infrastructure only. The FastAPI app and the ARQ worker run on the host
# during development (hot reload + attachable debugger); only the stateful
# services are containerised.
name: patient-ops

services:
  postgres:
    # pgvector image = Postgres 16 with the `vector` extension available.
    # Migration 0003 installs it; the knowledge base stores its embeddings in
    # a vector(1536) column and searches them by cosine distance.
    image: pgvector/pgvector:pg16
    container_name: patient-ops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patient_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patient_ops}
      POSTGRES_DB: ${POSTGRES_DB:-patient_ops}
    ports:
      # Host port is configurable: :5432 is often already taken by a local
      # Postgres install. Hard-coding host ports breaks on other machines.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # No /docker-entrypoint-initdb.d mount: those scripts run only when the
      # volume is first created, so they would never reach CI's database or
      # the test database. Extensions are installed by migrations instead.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patient_ops} -d ${POSTGRES_DB:-patient_ops}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: patient-ops-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    # No volume on purpose: Redis holds coordination state, never correctness
    # state. Losing it on restart must be survivable by design.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
