# Labelled messages for G0, the emergency filter (api/src/patient_ops/guardrails/emergency.py).
#
# api/tests/test_emergency.py checks every one:
#
#   positives   must be caught, as the category given. Any miss fails CI:
#               this is the list of things the filter promises to catch.
#   negatives   ordinary questions a dental clinic gets, several of them
#               sharing words with an emergency ("bad breath", "sensitive to
#               temperature", "bleeding gums"). A match here is a false
#               positive: measured and printed, not gated, because over-triage
#               is the failure this filter chooses. `known_false_positive`
#               marks the ones it knowingly gets wrong, so a new one stands out.
#
# Positives are written the way patients write -- lower case, typos, no
# punctuation, the emergency buried mid-sentence -- not the way the document
# words it. A filter tested only on the document's own phrases tests nothing.

positives:
  # --- er: breathing ---------------------------------------------------------
  - {text: "I can't breathe properly, my face is swollen", category: er}
  - {text: "cant breath", category: er}
  - {text: "I CAN NOT BREATHE", category: er}
  - {text: "it's getting hard to breathe since this morning", category: er}
  - {text: "my husband is having trouble breathing after his extraction", category: er}
  - {text: "short of breath and my jaw hurts", category: er}
  - {text: "i feel like my throat is closing", category: er}
  - {text: "my son is choking on a piece of his retainer", category: er}
  - {text: "difficulty breathing", category: er}
  # --- er: swallowing ----------------------------------------------------------
  - {text: "I can't swallow anything, even water", category: er}
  - {text: "it's really hard to swallow and my gum is swollen", category: er}
  - {text: "Having trouble swallowing since the root canal", category: er}
  # --- er: spreading swelling --------------------------------------------------
  - {text: "the swelling is spreading up toward my eye", category: er}
  - {text: "my cheek is swollen all the way to my eye", category: er}
  - {text: "Swelling going down my neck from the wisdom tooth", category: er}
  - {text: "my eye is almost swollen shut", category: er}
  - {text: "the area under my tongue is swollen and hard", category: er}
  - {text: "my neck looks puffy on the left side", category: er}
  # --- er: swelling with fever ------------------------------------------------
  - {text: "I have a fever and my face is swollen", category: er}
  - {text: "swollen jaw, running a temperature of 101", category: er}
  - {text: "my gum is swelling and I've got chills", category: er}
  # --- er: bleeding -------------------------------------------------------------
  - {text: "the bleeding won't stop after my tooth was pulled", category: er}
  - {text: "it's been bleeding for 3 hours and it wont stop", category: er}
  - {text: "I can't stop the bleeding from the socket", category: er}
  - {text: "bleeding heavily from my mouth", category: er}
  - {text: "there is so much blood, what do I do", category: er}
  - {text: "extraction site hasn't stopped bleeding even with gauze", category: er}
  # --- er: face, jaw or head injury ------------------------------------------
  - {text: "I think I broke my jaw", category: er}
  - {text: "my jaw is dislocated and I can't close my mouth", category: er}
  - {text: "fell off my bike and hit my head, now my teeth feel loose", category: er}
  - {text: "he was knocked out for a few seconds", category: er}
  - {text: "she passed out in the chair", category: er}
  - {text: "we were in a car accident and her face is hurt", category: er}
  - {text: "lost consciousness after falling", category: er}
  # --- er: chest pain -----------------------------------------------------------
  - {text: "I have chest pain and my jaw aches", category: er}
  - {text: "pain in my chest spreading to my left arm", category: er}
  - {text: "my chest feels tight and I'm sweating", category: er}
  - {text: "is jaw pain a sign of a heart attack? I'm having it now", category: er}
  # --- er beats urgent_dental when both are present ---------------------------
  - {text: "knocked out a tooth and hit my head", category: er}
  # --- urgent_dental: knocked-out tooth ----------------------------------------
  - {text: "my son knocked his front tooth out at football", category: urgent_dental}
  - {text: "I knocked out a tooth", category: urgent_dental}
  - {text: "my tooth got knocked out, what do I do", category: urgent_dental}
  - {text: "tooth fell out after I got hit with a ball", category: urgent_dental}
  - {text: "her front tooth came out completely when she fell", category: urgent_dental}
  - {text: "lost a tooth playing hockey", category: urgent_dental}
  - {text: "avulsed incisor", category: urgent_dental}
  # --- normalisation: curly quotes, full-width letters, punctuation ----------
  - {text: "I can’t breathe", category: er}
  - {text: "ｃａｎｔ ｂｒｅａｔｈｅ", category: er}
  - {text: "can't... breathe!!", category: er}
  # --- negation is not handled, on purpose ------------------------------------
  - {text: "I'm not having trouble breathing, just a toothache", category: er}

  # --- added in the Phase 7 audit: phrasings the first rules missed ---------
  # The first version matched phrases; these are why the rules now match
  # vocabulary in either order (see the comment above RULES).
  - {text: "I can hardly breathe", category: er}
  - {text: "breathing is really difficult right now", category: er}
  - {text: "it hurts to breathe", category: er}
  - {text: "I'm wheezing", category: er}
  - {text: "cant catch my breath", category: er}
  - {text: "I swallowed a tooth and now I'm coughing and can't get air", category: er}
  - {text: "my throat is swelling", category: er}
  - {text: "swelling under my jaw is spreading", category: er}
  - {text: "the swelling reached my neck", category: er}
  - {text: "my eye is swelling shut from the tooth infection", category: er}
  - {text: "my face swelled up and I feel feverish", category: er}
  - {text: "swelling is moving down into my neck and I have a temp of 102", category: er}
  - {text: "my lips and tongue are swelling after the anesthetic", category: er}
  - {text: "my tongue feels huge and I'm struggling to talk", category: er}
  - {text: "i think im having an allergic reaction to the numbing shot", category: er}
  - {text: "anaphylaxis", category: er}
  - {text: "blood won't stop coming out", category: er}
  - {text: "it keeps bleeding and bleeding", category: er}
  - {text: "bleeding nonstop since the extraction", category: er}
  - {text: "I'm bleeding a lot", category: er}
  - {text: "the gauze is soaked and it's still bleeding after 2 hours", category: er}
  - {text: "I was flossing and now it won't stop bleeding", category: er}
  - {text: "I got punched in the face and my jaw might be broken", category: er}
  - {text: "I fell and smashed my face on the pavement", category: er}
  - {text: "jaw locked open and I can't close it", category: er}
  - {text: "we were in a car crash, my teeth are broken", category: er}
  - {text: "i blacked out", category: er}
  - {text: "I feel like I'm going to pass out", category: er}
  - {text: "my kid's front tooth got knocked out", category: urgent_dental}
  - {text: "my adult tooth fell out when I got hit", category: urgent_dental}
  # --- crisis ------------------------------------------------------------------
  - {text: "I want to kill myself", category: crisis}
  - {text: "sometimes I think about suicide", category: crisis}
  - {text: "i don't want to be alive anymore", category: crisis}
  - {text: "I've been cutting myself", category: crisis}
  - {text: "the pain is so bad I want to die", category: crisis}
  - {text: "thinking of taking an overdose of my painkillers", category: crisis}
  # --- Spanish ------------------------------------------------------------------
  - {text: "No puedo respirar", category: er}
  - {text: "me cuesta mucho tragar", category: er}
  - {text: "la hinchazón me llega hasta el ojo", category: er}
  - {text: "tengo fiebre y la cara hinchada", category: er}
  - {text: "me estoy ahogando", category: er}
  - {text: "sigue sangrando, no para desde hace horas", category: er}
  - {text: "creo que tengo la mandíbula rota", category: er}
  - {text: "se desmayó en la silla", category: er}
  - {text: "dolor en el pecho", category: er}
  - {text: "tuve una reacción alérgica a la anestesia", category: er}
  - {text: "se me cayó un diente cuando me golpeé", category: urgent_dental}
  - {text: "quiero quitarme la vida", category: crisis}
  # --- Mandarin -----------------------------------------------------------------
  - {text: "喘不上气", category: er}
  - {text: "我咽不下东西", category: er}
  - {text: "脸肿到脖子了", category: er}
  - {text: "我发烧了，牙龈肿", category: er}
  - {text: "拔牙的地方血止不住", category: er}
  - {text: "下巴好像骨折了", category: er}
  - {text: "他晕倒了", category: er}
  - {text: "胸口疼", category: er}
  - {text: "打了麻药以后出现过敏反应", category: er}
  - {text: "打球时牙被撞掉了", category: urgent_dental}
  - {text: "我想自杀", category: crisis}
  # --- told in pieces: `context` is the conversation's earlier messages ----------
  - text: "and now I can't really swallow"
    context: ["my wisdom tooth area is sore"]
    category: er
  - text: "it's gone down to my neck"
    context: ["my jaw has been swollen for two days"]
    category: er
  - text: "y ahora me llega al ojo"
    context: ["tengo la cara hinchada"]
    category: er

negatives:
  - text: "What are your opening hours on Saturday?"
  - text: "How much is a cleaning without insurance?"
  - text: "Do you take Delta Dental PPO?"
  - text: "Please book me a cleaning"
  - text: "the second one"
  - text: "yes"
  - text: "(212) 555-0101"
  - text: "I have a toothache that wakes me up at night"
  - text: "my tooth is sensitive to temperature and my gum looks a bit swollen"
  - text: "My gums bleed a little when I floss"
  - text: "Is it normal for a bit of bleeding after a cleaning?"
  - text: "What can I do about bad breath?"
  - text: "I don't want bad breath after my implant"
  - text: "problems with bad breath"
  - text: "I lost a filling"
  - text: "My crown came off while eating"
  - text: "I chipped my tooth on a popcorn kernel"
  - text: "cracked tooth, hurts when I bite"
  - text: "how long does swelling last after a wisdom tooth extraction?"
  - text: "What is your after-hours emergency phone number?"
  - text: "What counts as a dental emergency?"
  - text: "Do you see children?"
  - text: "can I cancel my appointment tomorrow"
  - text: "I have a slight ache on the left side"
  - text: "my jaw clicks when I chew"
  - text: "can I bring my own headphones"
  - text: "whitening options?"
  - text: "the temporary crown feels loose"
  - text: "I'm nervous about the needle"
  - text: "Can I eat before my appointment?"
  # Knowingly caught. A baby tooth falling out on its own is normal; the reply
  # says baby teeth are not replanted and to call, which costs a sentence.
  - text: "my daughter's baby tooth fell out, is that okay?"
    known_false_positive: true
  # --- added in the Phase 7 audit: harder negatives -------------------------
  - text: "Is it normal to have a little bleeding after extraction?"
  - text: "my gums are swollen, should I come in?"
  - text: "how do I stop bad breath"
  - text: "do you treat jaw pain (TMJ)?"
  - text: "How much is teeth whitening? My sister said it hurts"
  - text: "My gums bleed a lot when I brush"
  - text: "my jaw locks sometimes when I yawn"
  - text: "the filling came out of my tooth"
  - text: "I have a sore throat"
  - text: "what if I swallow the mouthwash"
  - text: "it hurts when I bite down"
  - text: "I hit a hard piece of candy and my tooth hurts"
  - text: "my face hurts from smiling at the wedding"
  - text: "the numbness in my lip lasted hours"
  - text: "I'm allergic to penicillin"
  # Knowingly caught: each mentions an emergency's vocabulary in a context
  # a keyword rule cannot tell apart. Over-triage, by choice.
  - text: "can I get a cleaning if I have a cold and it's hard to breathe through my nose"
    known_false_positive: true
  - text: "I hit my head on the cabinet last week, unrelated, but can I book a cleaning?"
    known_false_positive: true
  - text: "What should I do if I knock out a tooth?"
    known_false_positive: true
  # --- crisis look-alikes ---------------------------------------------------------
  - text: "this toothache is killing me"
  - text: "I'm dying to get my teeth whitened"
  - text: "my kid would die of embarrassment with braces"
  # --- Spanish and Mandarin ---------------------------------------------------------
  - text: "¿A qué hora abren el sábado?"
  - text: "me sangran un poco las encías al cepillarme"
  - text: "se me cayó la corona"
  - text: "我的牙套掉了"
  - text: "孩子的乳牙松了"
  - text: "补牙多少钱"
  # --- the same emergency is not answered again for "ok thanks" -------------------
  - text: "ok thanks"
    context: ["I can't breathe and my face is swollen"]
  - text: "ok, I'm on my way to the ER"
    context: ["the bleeding won't stop"]
