# Labelled questions for calibrating and reporting the retrieval threshold.
#
# `make calibrate` embeds each question, searches the knowledge base, and
# records the best score. Questions the corpus answers should score high;
# questions it does not should score low. Where those two clouds separate is
# the threshold below which the assistant abstains.
#
#   split: calibration  the threshold is fitted on these
#   split: holdout      never used to choose the threshold, only to report it.
#                       Fitting and grading on the same questions measures
#                       nothing except how well the fitting worked.
#
# kind, for answerable questions:
#   direct      worded close to the document
#   paraphrase  a patient's words, not the document's -- the realistic case
#   multi_hop   needs passages from two documents; a hit means both were found
#
# kind, for unanswerable ones:
#   near_miss   sounds exactly like something this clinic would document, and
#               is not in the corpus. The dangerous class: an off-topic
#               question is easy to refuse, a plausible one is not. Every one
#               of these is also a KB_GAP report -- a document the clinic
#               should write.
#   structured  the answer exists, but in a table (insurance_plans, procedures,
#               provider_schedules), read by an exact query. Retrieval must
#               abstain and let Phase 4's tools answer.
#   off_topic   not about this clinic at all.

