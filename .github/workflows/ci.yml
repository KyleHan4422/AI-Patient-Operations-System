name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # A real Postgres, because the guarantees under test -- the no_overlap
    # EXCLUDE constraint, the UNIQUE idempotency key -- exist only in Postgres.
    # Same image and host port as docker-compose.yml. Redis is still not
    # needed: its failures are injected, not produced.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: patient_ops
          POSTGRES_PASSWORD: patient_ops
          POSTGRES_DB: patient_ops
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U patient_ops -d patient_ops"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://patient_ops:patient_ops@localhost:5433/patient_ops
      # Property tests replay the same examples on every run, so a red build
      # is reproducible locally with HYPOTHESIS_PROFILE=ci.
      HYPOTHESIS_PROFILE: ci
      # No API key in CI, by design: every test runs on the deterministic
      # echo model, so a red build is never a flaky model answer.
      LLM_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests scripts alembic

      # The project's central claim -- agents reason, they never write -- is
      # enforced here rather than promised in the README. Run before the test
      # suite so an architectural violation fails fast.
      - name: Architectural invariant (agents/ is read-only)
        run: uv run python scripts/check_invariants.py --verbose

      - name: Migrate
        run: uv run alembic upgrade head

      # LangGraph's checkpoint tables. Run BEFORE `alembic check` on purpose:
      # the check passing with these tables present proves env.py ignores them.
      - name: Checkpointer tables
        run: uv run python scripts/setup_checkpointer.py

      # The two scripts a fresh clone has to run. Ingestion goes through the
      # offline embedder (LLM_PROVIDER=fake above), so CI needs no API key and
      # a red build is never a provider outage.
      - name: Seed and ingest
        run: |
          uv run python scripts/seed.py
          uv run python scripts/ingest.py

      # Structural drift only (tables, columns, indexes, FKs, UNIQUE). Alembic
      # does not compare CHECK or EXCLUDE constraints; the test suite does
      # (test_migrations.py compares them via Postgres, test_constraints.py
      # checks they actually reject bad rows).
      - name: Models match migrations
        run: uv run alembic check

      # The suite builds its own throwaway patient_ops_test database from the
      # migrations. Dependency *outages* are still injected at the probe seam,
      # not produced by stopping containers.
      - name: Test
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
