[project]
name = "patient-ops"
version = "0.1.0"
description = "AI front-desk / patient operations system for a dental clinic"
requires-python = ">=3.12,<3.13"

dependencies = [
    # HTTP boundary
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Typed configuration loaded from the environment
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Postgres driver. psycopg3 (not asyncpg) because LangGraph's
    # AsyncPostgresSaver is built on psycopg3 -- one driver for the ORM, the
    # migrations and the checkpointer. Two pools, though: the checkpointer
    # needs autocommit connections, so [pool] gives it its own.
    "psycopg[binary,pool]>=3.2",
    # ORM + migrations. SQLAlchemy drives psycopg3 in both modes: async for
    # the app, sync for Alembic -- same URL, same driver.
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    # Redis: coordination layer (holds, breaker, idempotency) + ARQ backend
    "redis>=5.2",
    "arq>=0.26",
    # Structured logging
    "structlog>=24.4",
    # Conversation graph + its Postgres checkpointer (state survives restarts)
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    # LLM provider, reached only through adapters/llm/
    "langchain-openai>=1.6",
    # pgvector's SQLAlchemy type + psycopg adapter, for the knowledge base
    # embeddings. The `vector` extension itself is created by migration 0003.
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    # Property-based tests for the slot computation
    "hypothesis>=6.120",
    # Only scripts/calibrate_threshold.py draws the score distribution. A dev
    # dependency, not a runtime one: the app never plots anything.
    "matplotlib>=3.9",
]

# ---------------------------------------------------------------------------
# Build backend: tells the packaging tool where the importable code lives.
# "src layout" -- code is under src/, so tests import the INSTALLED package
# rather than accidentally importing the source directory.
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patient_ops"]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "db: needs a running Postgres (make up). Deselect with -m 'not db'.",
    "redis: needs a running Redis (make up). Deselect with -m 'not redis'.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
# api/alembic/ (the migrations directory) would otherwise make ruff file the
# alembic library under first-party imports.
known-third-party = ["alembic"]
