# Alembic: versioned, ordered schema changes. Run from api/ (or via `make migrate`).
#
# The database URL is deliberately NOT here: env.py reads it from the app's own
# Settings (DATABASE_URL in the repo-root .env), so there is one source of
# truth for where the database is.

[alembic]
script_location = %(here)s/alembic
path_separator = os
# Files named "<revision>_<slug>.py" -- e.g. 0001_domain_core.py -- so the
# chain reads in order in a directory listing.
file_template = %%(rev)s_%%(slug)s
# No prepend_sys_path: patient_ops is an installed package, so env.py imports
# it normally, and api/ stays off sys.path -- where this alembic/ directory
# could otherwise be mistaken for the alembic library itself.

[post_write_hooks]
# Newly generated migrations are formatted like the rest of the codebase.
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
